<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Avia — Saiba antes. Vá com confiança. Descubra a acessibilidade real de estabelecimentos.">
  <title>Avia — Saiba antes. Vá com confiança.</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <!-- Demo notice banner - always visible -->
  <div class="demo-banner" role="status">
    <span aria-hidden="true">⚠</span>
    Dados demonstrativos, não representam avaliações reais.
  </div>

  <!-- Skip link for keyboard nav -->
  <a href="#main-content" class="skip-link">Pular para o conteúdo principal</a>

  <!-- Header with nav -->
  <header class="header">
    <a href="#/" class="header__logo" aria-label="Avia — Página inicial">
      <img src="/assets/logo.svg" alt="" width="32" height="37">
      <span class="header__wordmark">avia</span>
    </a>
    <nav class="header__nav" aria-label="Navegação principal">
      <a href="#/" class="nav-link" data-nav="home">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3L4 9v12h5v-7h6v7h5V9z" fill="currentColor"/></svg>
        <span>Início</span>
      </a>
      <a href="#/preferences" class="nav-link" data-nav="preferences">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zm-9 4a9 9 0 1118 0 9 9 0 01-18 0z" fill="currentColor"/></svg>
        <span>Preferências</span>
      </a>
      <a href="#/results" class="nav-link" data-nav="results">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zM9.5 14A4.5 4.5 0 1114 9.5 4.5 4.5 0 019.5 14z" fill="currentColor"/></svg>
        <span>Buscar</span>
      </a>
      <a href="#/route" class="nav-link" data-nav="route">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1114.5 9 2.5 2.5 0 0112 11.5z" fill="currentColor"/></svg>
        <span>Rota</span>
      </a>
    </nav>
  </header>

  <!-- Main content area -->
  <main id="main-content" class="main" aria-live="polite">
    <!-- Content rendered by JS -->
  </main>

  <!-- Bottom nav for mobile -->
  <nav class="bottom-nav" aria-label="Navegação principal (mobile)">
    <a href="#/" class="bottom-nav__link" data-nav="home">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3L4 9v12h5v-7h6v7h5V9z" fill="currentColor"/></svg>
      <span>Início</span>
    </a>
    <a href="#/preferences" class="bottom-nav__link" data-nav="preferences">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zm-9 4a9 9 0 1118 0 9 9 0 01-18 0z" fill="currentColor"/></svg>
      <span>Preferências</span>
    </a>
    <a href="#/results" class="bottom-nav__link" data-nav="results">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zM9.5 14A4.5 4.5 0 1114 9.5 4.5 4.5 0 019.5 14z" fill="currentColor"/></svg>
      <span>Buscar</span>
    </a>
    <a href="#/route" class="bottom-nav__link" data-nav="route">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1114.5 9 2.5 2.5 0 0112 11.5z" fill="currentColor"/></svg>
      <span>Rota</span>
    </a>
  </nav>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
